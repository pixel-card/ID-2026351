<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>

    <title>Ahmad Ramadan - Profile OS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Cairo & Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS Variables & Global Config */
        :root {
            --primary-bg: #0f172a;
            --phone-border: #333;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            background-color: #111;
            background-image: radial-gradient(circle at 50% 50%, #2a2a2a 0%, #000 100%);
            font-family: 'Poppins', 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Phone Frame - Modern Look */
        .phone-frame {
            width: 370px;
            height: 760px;
            /* Wallpaper Gradient */
            background: linear-gradient(180deg, #4c1d95 0%, #1e1b4b 60%, #000000 100%);
            border-radius: 45px;
            position: relative;
            box-shadow: 
                0 0 0 10px #2d2d2d, /* Bezel */
                0 0 0 12px #000,    /* Outer Edge */
                0 50px 100px rgba(0,0,0,0.7); /* Drop Shadow */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Notch (Dynamic Island Style) */
        .notch {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 28px;
            background-color: black;
            border-radius: 20px;
            z-index: 50;
        }

        /* Content Area */
        .screen-content {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            position: relative;
            scrollbar-width: none; /* Firefox */
        }
        .screen-content::-webkit-scrollbar { display: none; } /* Chrome */

        /* Profile Card with Glass Effect */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 25px 15px;
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .profile-img-container {
            width: 120px;
            height: 120px;
            padding: 4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f3f4f6, #9ca3af);
            margin-bottom: 12px;
            position: relative;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1f2937;
        }

        /* App Icons Styling */
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .app-item:hover {
            transform: translateY(-5px) scale(1.02);
        }
        
        .app-item:active {
            transform: scale(0.95);
        }

        .app-icon {
            width: 62px;
            height: 62px;
            border-radius: 16px; /* Squircle */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .app-icon::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
            pointer-events: none;
        }

        /* App Labels */
        .app-label {
            font-size: 11px;
            color: #e5e7eb;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        /* Icon Gradients */
        .bg-wa { background: linear-gradient(135deg, #25D366, #075E54); }
        .bg-fb { background: linear-gradient(135deg, #1877F2, #004494); }
        .bg-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
        .bg-tiktok { background: linear-gradient(135deg, #000000, #252525); }
        .bg-phone { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .bg-saraha { background: linear-gradient(135deg, #374151, #111827); border: 1px solid #4b5563; }
        
        /* InstaPay Special Styling */
        .bg-instapay { 
            background: linear-gradient(135deg, #4b0082, #240046); 
            border: 1px solid #7c3aed;
        }

        /* Portfolio Special Styling */
        .bg-portfolio { 
            background: #000; 
            border: 1px solid white;
        }

        /* Navigation Bar */
        .nav-bar {
            height: 65px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 5px;
        }

        .nav-shape {
            padding: 10px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .nav-shape:hover { opacity: 1; }

    </style>
</head>
<body>

    <!-- Logic -->
    <script>
        // Update Time
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours % 12 || 12; 
            minutes = minutes < 10 ? '0'+ minutes : minutes;
            document.getElementById('clock').innerText = hours + ':' + minutes;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Home Button Logic
        function goHome() {
            document.getElementById('homeScreen').scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
